<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Dashboard || Real-Time Chat App</title>

        <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    </head>

    <body>
        {% include 'navbar.html' %}

        <div class="dashboard-container">

            <div class="dashboard-card">

                <h1>
                    Welcome, {{ username }} 👋
                </h1>

                <p class="lead mt-3">

                    Connect with friends and groups
                    using real-time communication.

                </p>

                <div class="d-grid gap-3 d-md-flex justify-content-center">

                    <a href="/chat" class="btn btn-success btn-lg">

                        Enter Chat Room

                    </a>

                    <a href="/logout" class="btn btn-danger btn-lg">

                        Logout

                    </a>

                </div>

            </div>

        </div>

        {% include 'footer.html' %}

    </body>
    
</html>
